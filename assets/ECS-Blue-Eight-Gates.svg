<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 390" role="img" aria-label="ECS blue cybersecurity information panels">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041525"/><stop offset="1" stop-color="#0b2542"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d3155"/><stop offset="1" stop-color="#071d36"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F9FE5"/><stop offset="1" stop-color="#4DD7FF"/></linearGradient>
 </defs>
 <rect width="1600" height="390" rx="22" fill="url(#bg)"/>
 <rect x="1" y="1" width="1598" height="388" rx="21" fill="none" stroke="#12638d" stroke-width="2"/>
<text x="800" y="51" text-anchor="middle" fill="#DDF5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="2">EIGHT SECURITY GATES</text>
<text x="800" y="80" text-anchor="middle" fill="#7CCDEF" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Two complementary routes: protected administration and protected customer access</text><rect x="25" y="110" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="40" y="127" width="57" height="38" rx="10" fill="#0A6798"/><text x="68" y="155" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">01</text><text x="111" y="154" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">OPERATOR</text><text x="44" y="201" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Secure laptop and endpoint</text><rect x="420" y="110" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="435" y="127" width="57" height="38" rx="10" fill="#0A6798"/><text x="463" y="155" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">02</text><text x="506" y="154" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">ADMIN ROUTE</text><text x="439" y="201" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Network identity and access</text><rect x="815" y="110" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="830" y="127" width="57" height="38" rx="10" fill="#0A6798"/><text x="858" y="155" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">03</text><text x="901" y="154" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">ACCOUNTS</text><text x="834" y="201" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Privilege and recovery</text><rect x="1210" y="110" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="1225" y="127" width="57" height="38" rx="10" fill="#0A6798"/><text x="1253" y="155" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">04</text><text x="1296" y="154" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">PRIVATE VPS</text><text x="1229" y="201" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">OS, firewall and services</text><rect x="25" y="248" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="40" y="265" width="57" height="38" rx="10" fill="#0A6798"/><text x="68" y="293" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">05</text><text x="111" y="292" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">EDGE / ONION</text><text x="44" y="339" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">DNS, exposure or Tor</text><rect x="420" y="248" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="435" y="265" width="57" height="38" rx="10" fill="#0A6798"/><text x="463" y="293" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">06</text><text x="506" y="292" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">DEPLOYMENT</text><text x="439" y="339" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Supply chain and secrets</text><rect x="815" y="248" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="830" y="265" width="57" height="38" rx="10" fill="#0A6798"/><text x="858" y="293" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">07</text><text x="901" y="292" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">APPLICATION</text><text x="834" y="339" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Code and API hardening</text><rect x="1210" y="248" width="365" height="121" rx="16" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="1225" y="265" width="57" height="38" rx="10" fill="#0A6798"/><text x="1253" y="293" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700">08</text><text x="1296" y="292" fill="#F0FCFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">PAYMENTS</text><text x="1229" y="339" fill="#A7D9F3" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Separated trust boundary</text></svg>