<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 435" role="img" aria-label="ECS blue cybersecurity information panels">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041525"/><stop offset="1" stop-color="#0b2542"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d3155"/><stop offset="1" stop-color="#071d36"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F9FE5"/><stop offset="1" stop-color="#4DD7FF"/></linearGradient>
 </defs>
 <rect width="1600" height="435" rx="22" fill="url(#bg)"/>
 <rect x="1" y="1" width="1598" height="433" rx="21" fill="none" stroke="#12638d" stroke-width="2"/>
<text x="800" y="56" text-anchor="middle" fill="#DDF5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="2">ECS — FOUR FOUNDATIONS OF WEBSITE SECURITY</text>
<text x="800" y="89" text-anchor="middle" fill="#7CCDEF" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Harden the hosting  ·  Embed defenses in code  ·  Verify protection  ·  Add services where required</text><rect x="25" y="118" width="365" height="287" rx="17" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="25" y="118" width="365" height="7" rx="3" fill="url(#edge)"/><circle cx="70" cy="176" r="28" fill="#0B486A" stroke="#29C6FF" stroke-width="2"/><text x="70" y="185" fill="#E0F9FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">01</text><text x="45" y="230" fill="#E7F7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">HOSTING HARDENING</text><circle cx="54" cy="273" r="4" fill="#44D2FF"/><text x="68" y="279" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">CIS Level 2 objectives</text><circle cx="54" cy="303" r="4" fill="#44D2FF"/><text x="68" y="309" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Applicable DISA STIG / SRG</text><circle cx="54" cy="333" r="4" fill="#44D2FF"/><text x="68" y="339" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Restricted OS, services &amp; access</text><circle cx="54" cy="363" r="4" fill="#44D2FF"/><text x="68" y="369" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Kernel, firewall, TLS &amp; recovery</text><rect x="420" y="118" width="365" height="287" rx="17" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="420" y="118" width="365" height="7" rx="3" fill="url(#edge)"/><circle cx="465" cy="176" r="28" fill="#0B486A" stroke="#29C6FF" stroke-width="2"/><text x="465" y="185" fill="#E0F9FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">02</text><text x="440" y="230" fill="#E7F7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">WEBSITE CODE SECURITY</text><circle cx="449" cy="273" r="4" fill="#44D2FF"/><text x="463" y="279" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Server-side authorization</text><circle cx="449" cy="303" r="4" fill="#44D2FF"/><text x="463" y="309" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Secure sessions &amp; input handling</text><circle cx="449" cy="333" r="4" fill="#44D2FF"/><text x="463" y="339" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Safe APIs, secrets &amp; dependencies</text><circle cx="449" cy="363" r="4" fill="#44D2FF"/><text x="463" y="369" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Built in from first deployment</text><rect x="815" y="118" width="365" height="287" rx="17" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="815" y="118" width="365" height="7" rx="3" fill="url(#edge)"/><circle cx="860" cy="176" r="28" fill="#0B486A" stroke="#29C6FF" stroke-width="2"/><text x="860" y="185" fill="#E0F9FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">03</text><text x="835" y="230" fill="#E7F7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">VERIFIED ASSURANCE</text><circle cx="844" cy="273" r="4" fill="#44D2FF"/><text x="858" y="279" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Baseline &amp; threat model</text><circle cx="844" cy="303" r="4" fill="#44D2FF"/><text x="858" y="309" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Authorization and security testing</text><circle cx="844" cy="333" r="4" fill="#44D2FF"/><text x="858" y="339" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Remediate, re-test &amp; document</text><circle cx="844" cy="363" r="4" fill="#44D2FF"/><text x="858" y="369" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Monitoring &amp; restore exercises</text><rect x="1210" y="118" width="365" height="287" rx="17" fill="url(#panel)" stroke="#1589CC" stroke-width="2"/><rect x="1210" y="118" width="365" height="7" rx="3" fill="url(#edge)"/><circle cx="1255" cy="176" r="28" fill="#0B486A" stroke="#29C6FF" stroke-width="2"/><text x="1255" y="185" fill="#E0F9FF" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">04</text><text x="1230" y="230" fill="#E7F7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">OPTIONAL DEFENSE LAYERS</text><circle cx="1239" cy="273" r="4" fill="#44D2FF"/><text x="1253" y="279" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">WAF &amp; DDoS controls</text><circle cx="1239" cy="303" r="4" fill="#44D2FF"/><text x="1253" y="309" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">CDN, bot mitigation &amp; rate limits</text><circle cx="1239" cy="333" r="4" fill="#44D2FF"/><text x="1253" y="339" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Managed monitoring / DNS</text><circle cx="1239" cy="363" r="4" fill="#44D2FF"/><text x="1253" y="369" fill="#BEE2F5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Selected for actual risk and budget</text></svg>